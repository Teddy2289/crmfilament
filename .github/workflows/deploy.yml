name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-mbl-service:
    name: Deploy to crm-v2.mbl-service.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /home/contact/web/crm-v2.mbl-service.com

            echo "==> Discarding any local server-side changes..."
            git reset --hard HEAD

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Installing Node dependencies & building assets..."
            npm ci
            npm run build

            echo "==> Putting app in maintenance mode..."
            php artisan down --retry=60

            echo "==> Running database migrations..."
            php artisan migrate --force

            echo "==> Clearing & rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan icons:cache
            php artisan filament:cache-components

            echo "==> Fixing permissions..."
            sudo chown -R contact:contact storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "==> Bringing app back online..."
            php artisan up

            echo "==> Deployment complete!"

  deploy-ns-conseil:
    name: Deploy to manage.ns-conseil.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /home/contact/web/manage.ns-conseil.com

            echo "==> Discarding any local server-side changes..."
            git reset --hard HEAD

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Installing Node dependencies & building assets..."
            npm ci
            npm run build

            echo "==> Putting app in maintenance mode..."
            php artisan down --retry=60

            echo "==> Running database migrations..."
            php artisan migrate --force

            echo "==> Clearing & rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan icons:cache
            php artisan filament:cache-components

            echo "==> Fixing permissions..."
            sudo chown -R contact:contact storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "==> Bringing app back online..."
            php artisan up

            echo "==> Running read-only phone search smoke test..."
            php artisan crm:phone-search-smoke
            echo "==> Checking public login endpoint..."
            HTTP_STATUS=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out "%{http_code}" https://manage.ns-conseil.com/ns-conseil/login)
            case "$HTTP_STATUS" in
              200|301|302|303|307|308) echo "Public endpoint healthy (HTTP $HTTP_STATUS)" ;;
              *) echo "Public endpoint check failed (HTTP $HTTP_STATUS)" >&2; exit 1 ;;
            esac
            echo "==> Deployment smoke tests complete!"
            echo "==> Deployment complete!"